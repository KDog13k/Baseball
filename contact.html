<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — BaseWits</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #14291d 0%, #1f4530 50%, #14291d 100%);
        color: #f0f0f0;
        line-height: 1.6;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .container {
        max-width: 600px;
        width: 100%;
        background: rgba(255,255,255,0.05);
        border: 3px solid #8b5a2b;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
    }
    h1 {
        color: #f5ead9;
        font-size: 2rem;
        margin-bottom: 10px;
    }
    p {
        color: rgba(255,255,255,0.85);
        margin-bottom: 25px;
    }
    .email-box {
        display: inline-block;
        background: rgba(74,46,20,0.9);
        border: 2px solid #5c3a1e;
        border-radius: 12px;
        padding: 16px 30px;
        margin-bottom: 25px;
    }
    .email-box a {
        color: #a8d08d;
        font-size: 1.2rem;
        font-weight: bold;
        text-decoration: none;
    }
    .email-box a:hover {
        text-decoration: underline;
    }
    .back-link {
        display: inline-block;
        color: #a8d08d;
        text-decoration: none;
        font-weight: bold;
        margin-top: 10px;
    }
    .back-link:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Get In Touch</h1>
    <p>Questions, feedback, a trivia fact you think we got wrong, or just want to say hi? Reach out any time.</p>
    <div class="email-box">
        <a href="mailto:contact@basewits.com">contact@basewits.com</a>
    </div>
    <br>
    <a href="index.html" class="back-link">← Back to BaseWits</a>
</div>
</body>
</html>
